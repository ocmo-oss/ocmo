server {
    listen 80;
    server_name localhost;

    # ── OIDC provider ─────────────────────────────────────────────────────────
    location /dex {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  '*'                                                                    always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE'                                     always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Max-Age'       1728000;
            add_header 'Content-Type'                 'text/plain; charset=utf-8';
            add_header 'Content-Length'               0;
            return 204;
        }
        proxy_pass http://oidc-provider:9000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dex device-flow callback: Dex redirects to /device/callback after browser login.
    # That path is outside /dex, so route it explicitly to the IdP (not the SPA).
    location = /device/callback {
        proxy_pass http://oidc-provider:9000/dex/device/callback;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Django / Ninja static assets (Swagger UI, etc.) ───────────────────────
    location /static/ {
        proxy_pass http://api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── OCMO API ───────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Support large YAML uploads and resolve responses.
        client_max_body_size 32m;
        proxy_read_timeout   120s;
    }

    # ── Artifact offload (filesystem) ─────────────────────────────────────────
    # The API emits X-Accel-Redirect: /_ocmo_artifacts/<sha[:2]>/<sha[2:4]>/<sha>
    # Set OCMO_RESOLVE_DOWNLOAD_XACCEL_LOCATION=/_ocmo_artifacts to enable.
    location /_ocmo_artifacts/ {
        internal;
        alias /tmp/ocmo/resolved/;
    }

    # ── Artifact offload (Redis) ───────────────────────────────────────────────
    # Redis artifact offload (ngx_http_redis); conf dropped in by gateway
    # entrypoint when the redis service is reachable.
    include /etc/nginx/conf.d/ocmo-redis/*.conf;

    # ── Frontend (React SPA) ───────────────────────────────────────────────────
    # All unmatched paths → frontend service.  The frontend nginx handles
    # client-side routing via try_files … /index.html.
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Forward WebSocket upgrade for potential dev-server HMR (no-op in prod).
        proxy_http_version  1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
