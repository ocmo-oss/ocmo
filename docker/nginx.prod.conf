server {
    listen 80;
    server_name _;

    # ── Django / Ninja static assets (Swagger UI, etc.) ───────────────────────
    location /static/ {
        proxy_pass http://api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── OCMO API ───────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32m;
        proxy_read_timeout   120s;
    }

    # ── Artifact offload (filesystem) ─────────────────────────────────────────
    # The API emits X-Accel-Redirect: /_ocmo_artifacts/<sha[:2]>/<sha[2:4]>/<sha>
    # Set OCMO_RESOLVE_DOWNLOAD_XACCEL_LOCATION=/_ocmo_artifacts to enable.
    location /_ocmo_artifacts/ {
        internal;
        alias /tmp/ocmo/resolved/;
    }

    # ── Artifact offload (Redis) ───────────────────────────────────────────────
    include /etc/nginx/conf.d/ocmo-redis/*.conf;

    # ── Frontend (React SPA) ───────────────────────────────────────────────────
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
