# Local development and integration-test stack.
#
# WARNING: Insecure defaults (Dex OIDC, DJANGO_SECRET_KEY, POSTGRES_PASSWORD, OCMO_MASTER_KEY).
# For local use only — never expose this stack to an untrusted network. See SECURITY.md.
#
# Includes Postgres, Redis, Dex OIDC, API, frontend, and gateway with dev images
# and source bind-mounts. For Vite HMR, add docker-compose.hmr.yml:
#
#   docker compose -f docker-compose.dev.yml -f docker-compose.hmr.yml up
#
# RQ worker (requires Redis profile or default redis service):
#   docker compose -f docker-compose.dev.yml --profile worker up

services:
  postgres:
    image: postgres:15-alpine
    container_name: ocmo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ocmoapi}
      POSTGRES_USER: ${POSTGRES_USER:-ocmoapi-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ocmoapi1906031218435}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ocmoapi-user} -d ${POSTGRES_DB:-ocmoapi}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ocmo-network

  redis:
    profiles: ["worker", "resolve-redis"]
    image: redis:7-alpine
    container_name: ocmo-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ocmo-network

  oidc-provider:
    image: ghcr.io/dexidp/dex:v2.45.1
    container_name: oidc-provider
    environment:
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-ocmo-api}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/dex/}
    volumes:
      - ./docker/dex-config.yaml:/etc/dex/config.yaml
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9000/dex/.well-known/openid-configuration"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ocmo-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    image: ocmo-api-dev:latest
    container_name: ocmo-api
    environment:
      DJANGO_SETTINGS_MODULE: ocmoapi.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      POSTGRES_DB: ${POSTGRES_DB:-ocmoapi}
      POSTGRES_USER: ${POSTGRES_USER:-ocmoapi-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ocmoapi1906031218435}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      OIDC_DISCOVERY_DOCUMENT_URL: ${OIDC_DISCOVERY_DOCUMENT_URL:-http://oidc-provider:9000/dex/.well-known/openid-configuration}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://oidc-provider:9000/dex/keys}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-ocmo-api}
      OIDC_JWT_AUDIENCES: ${OIDC_JWT_AUDIENCES:-ocmo-api,ocmo-sdk}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/dex/}
      OIDC_AUTHORIZATION_URL: ${OIDC_AUTHORIZATION_URL:-http://localhost:8080/dex/auth}
      OIDC_TOKEN_URL: ${OIDC_TOKEN_URL:-http://localhost:8080/dex/token}
      OIDC_SWAGGER_REDIRECT_URL: ${OIDC_SWAGGER_REDIRECT_URL:-http://localhost:8080/api/docs/oauth2-redirect.html}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email groups}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      OCMO_MASTER_KEY: ${OCMO_MASTER_KEY:-ZDPuvW6Hx/1UxDK7K/CydLouVKtJl24nbHyb2EkvTzs=}
      OCMO_PUBLIC_URL: ${OCMO_PUBLIC_URL:-http://localhost:8080}
      OCMO_RESOLVE_ARTIFACT_DIR: /tmp/ocmo/resolved
      OCMO_RESOLVE_ARTIFACT_BACKEND: ${OCMO_RESOLVE_ARTIFACT_BACKEND:-fs}
      OCMO_RESOLVE_CACHE_BACKEND: ${OCMO_RESOLVE_CACHE_BACKEND:-locmem}
      GIT_SYNC_TEMP_DIR: /tmp/git-sync
      GIT_SYNC_LOG_DIR: /var/log/ocmo-api/sync
    volumes:
      - ./api:/app
      - ocmo_artifacts:/tmp/ocmo/resolved
      - git_sync_logs:/var/log/ocmo-api/sync
      - git_sync_temp:/tmp/git-sync
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      oidc-provider:
        condition: service_healthy
    networks:
      - ocmo-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    image: ocmo-frontend:latest
    container_name: ocmo-frontend
    networks:
      - ocmo-network

  gateway:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile.dev
    image: ocmo-gateway-dev:latest
    container_name: ocmo-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ocmo_artifacts:/tmp/ocmo/resolved:ro
    depends_on:
      oidc-provider:
        condition: service_healthy
      api:
        condition: service_started
      frontend:
        condition: service_started
      redis:
        condition: service_healthy
        required: false
    networks:
      - ocmo-network

  rq-worker:
    profiles: ["worker"]
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    image: ocmo-api-dev:latest
    container_name: ocmo-rq-worker
    environment:
      DJANGO_SETTINGS_MODULE: ocmoapi.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-key}
      POSTGRES_DB: ${POSTGRES_DB:-ocmoapi}
      POSTGRES_USER: ${POSTGRES_USER:-ocmoapi-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ocmoapi1906031218435}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      GIT_SYNC_TEMP_DIR: /tmp/git-sync
      GIT_SYNC_LOG_DIR: /var/log/ocmo-api/sync
    volumes:
      - ./api:/app
      - git_sync_logs:/var/log/ocmo-api/sync
      - git_sync_temp:/tmp/git-sync
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        mkdir -p /var/log/ocmo-api/sync /tmp/git-sync &&
        uv run python manage.py rqworker git_sync default
      "
    networks:
      - ocmo-network

volumes:
  postgres_data:
  redis_data:
  ocmo_artifacts:
  git_sync_logs:
  git_sync_temp:

networks:
  ocmo-network:
    driver: bridge
