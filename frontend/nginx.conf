server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Serve pre-compressed assets when available.
    gzip_static on;

    # All unmatched paths return index.html so that React Router handles routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache immutable hashed assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the entry point (browser must always fetch the latest shell).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
