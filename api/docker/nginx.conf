server {
    listen 80;
    server_name localhost;

    # 1. OIDC Provider Routes
    # Redirecting specific OIDC paths to the mock provider
    location /dex {

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        proxy_pass http://oidc-provider:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dex device-flow callback: Dex redirects to /device/callback after browser login.
    location = /device/callback {
        proxy_pass http://oidc-provider:9000/dex/device/callback;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Internal location for fs artifact X-Accel-Redirect offload.
    # The API emits X-Accel-Redirect: /_ocmo_artifacts/<sha[:2]>/<sha[2:4]>/<sha>
    # Set OCMO_RESOLVE_DOWNLOAD_XACCEL_LOCATION=/_ocmo_artifacts to enable.
    location /_ocmo_artifacts/ {
        internal;
        alias /tmp/ocmo/resolved/;
    }

    # Redis artifact offload (ngx_http_redis); conf dropped in by gateway entrypoint when redis is up.
    include /etc/nginx/conf.d/ocmo-redis/*.conf;

    # 3. Main Application — everything else goes to the Python app.
    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}