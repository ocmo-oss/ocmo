_ocmo:
  is_json_schema: true
$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required:
  - enabled
properties:
  enabled:
    type: boolean
  repository_url:
    type: string
  ssh_private_key:
    type: string
  git_username:
    type: string
  git_password:
    type: string
  branch:
    type: string
  path_prefix:
    type: string
  commit_versions:
    type: boolean
