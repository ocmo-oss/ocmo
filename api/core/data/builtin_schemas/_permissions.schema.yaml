_ocmo:
  is_json_schema: true
$schema: https://json-schema.org/draft/2020-12/schema
title: Namespace permissions policy document
description: ABAC policies evaluated on every namespace operation. Policies are matched top-to-bottom;
  explicit Deny wins over Allow.
type: object
additionalProperties: false
required:
- policies
properties:
  policies:
    type: array
    description: Ordered list of allow/deny policies.
    items:
      type: object
      additionalProperties: false
      required:
      - effect
      - actors
      - actions
      - resources
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 200
          description: Optional stable identifier for audits and documentation.
          examples:
          - allow-dev-readers
        description:
          type: string
          maxLength: 500
          description: Human-readable summary of what this policy grants or denies.
          examples:
          - Allow developers read access to project/dev/**
        effect:
          type: string
          enum:
          - Allow
          - Deny
          description: Whether matching requests are allowed or denied.
          examples:
          - Allow
        actors:
          type: array
          minItems: 1
          description: Who the policy applies to. User actors match OIDC claims; Resolver actors match
            resolver identities by tree path.
          items:
            oneOf:
            - type: object
              additionalProperties: false
              required:
              - kind
              - claims
              properties:
                kind:
                  const: User
                  description: Match authenticated human users.
                claims:
                  type: object
                  minProperties: 1
                  description: OIDC claim names mapped to literal values or ``*``. Use ``{!user.<claim>}``
                    only in resource globs, not here.
                  additionalProperties:
                    type: string
                    minLength: 1
                    pattern: ^(\*|\{!user\.[a-zA-Z0-9_]+\}|(?!.*\{!).+)$
                    description: Claim value, wildcard ``*``, or interpolation placeholder.
                    examples:
                    - alice@example.com
                    - '*'
                  examples:
                  - email: alice@example.com
            - type: object
              additionalProperties: false
              required:
              - kind
              - path
              properties:
                kind:
                  const: Resolver
                  description: Match a resolver identity by its tree path.
                path:
                  type: string
                  minLength: 1
                  maxLength: 512
                  format: uri-reference
                  x-ocmo-uri-reference: resolver
                  description: Resolver tree path. Use ``*`` to match any resolver. Relative paths resolve
                    from the ``_permissions`` folder.
                  examples:
                  - deploy/prod
                  - '*'
        actions:
          type: array
          minItems: 1
          description: Permission operations this policy governs. Use ``resource:verb`` pairs; ``*`` wildcards
            match any resource or verb.
          items:
            type: string
            pattern: ^(config|template|resolver|secret|lock|folder|\*):(read|write|delete|resolve|tag|describe|audit|\*)$
            enum:
            - config:read
            - config:write
            - config:delete
            - config:resolve
            - config:tag
            - config:describe
            - config:audit
            - template:read
            - template:write
            - template:delete
            - template:tag
            - template:describe
            - template:audit
            - resolver:read
            - resolver:write
            - resolver:delete
            - resolver:audit
            - secret:read
            - secret:write
            - secret:delete
            - secret:resolve
            - secret:tag
            - secret:describe
            - secret:audit
            - lock:read
            - lock:write
            - lock:delete
            - folder:describe
            - folder:audit
            - config:*
            - template:*
            - resolver:*
            - secret:*
            - lock:*
            - '*:read'
            - '*:write'
            - '*:delete'
            - '*:resolve'
            - '*:tag'
            - '*:describe'
            - '*:audit'
            - '*:*'
            description: Concrete ``<resource>:<verb>`` pair or glob such as ``config:*``, ``*:read``,
              or ``*:*``.
            examples:
            - config:read
            - config:*
            - '*:read'
            - '*:*'
          examples:
          - - config:read
            - config:describe
        resources:
          type: array
          minItems: 1
          description: Resource path globs the policy applies to. Supports ``*`` and ``**`` fnmatch patterns
            and ``{!user.claim}`` interpolation.
          items:
            type: string
            minLength: 1
            maxLength: 512
            format: uri-reference
            x-ocmo-uri-reference: resource
            description: Tree path or glob (e.g. ``project/dev/**``, ``secrets/**``). Folder paths may
              end with ``/**`` to match all descendants under the folder.
            examples:
            - project/dev/**
            - app/prod/**
            - '**'
          examples:
          - - project/dev/**
        conditions:
          type: object
          additionalProperties: false
          description: Optional constraints that must all match for the policy to apply.
          properties:
            ip_range:
              type: array
              minItems: 1
              description: Client IP ranges (IPv4/IPv6 CIDR). Denied when IP is unknown.
              items:
                type: string
                pattern: ^(?:(?:\d{1,3}\.){3}\d{1,3}(?:\/(?:\d|[1-2]\d|3[0-2]))?|[0-9a-fA-F:]+(?:\/\d{1,3})?)$
                description: IPv4 or IPv6 network in CIDR notation.
                examples:
                - 10.0.0.0/8
                - 2001:db8::/32
            time_of_day:
              type: array
              minItems: 1
              description: UTC time windows when the policy is active (half-open intervals).
              items:
                type: string
                pattern: ^(?:[01]\d|2[0-3]):[0-5]\d-(?:[01]\d|2[0-3]):[0-5]\d$
                description: UTC time range ``HH:MM-HH:MM``.
                examples:
                - 09:00-17:30
    examples:
    - - effect: Allow
        actors:
        - kind: User
          claims:
            email: '*'
        actions:
        - config:read
        resources:
        - project/**
