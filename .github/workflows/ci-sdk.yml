name: CI — SDK

on:
  pull_request:
    paths:
      - .github/workflows/ci-sdk.yml
      - pyproject.toml
      - uv.lock
      - sdk/**
  push:
    branches: [main]
    paths:
      - .github/workflows/ci-sdk.yml
      - pyproject.toml
      - uv.lock
      - sdk/**

concurrency:
  group: ci-sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen --package ocmo-sdk

      - name: Ruff lint
        working-directory: sdk
        run: uv run ruff check ocmo/ tests/

      - name: Ruff format check
        working-directory: sdk
        run: uv run ruff format --check ocmo/ tests/

      - name: Mypy
        working-directory: sdk
        run: uv run mypy ocmo/ --exclude ocmo/_generated

      - name: Unit tests
        working-directory: sdk
        run: uv run pytest
