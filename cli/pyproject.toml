[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocmo-cli"
version = "0.8.19"
description = "Command-line interface for the OCMO configuration service"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "OCMO OSS Contributors" }]
keywords = ["configuration", "cli", "yaml", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "click>=8.1,<9",
    "ocmo-sdk>=0.8.19,<0.9",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
ocmo = "ocmo_cli.main:cli"

[project.urls]
Homepage = "https://github.com/ocmo-oss/ocmo"
Repository = "https://github.com/ocmo-oss/ocmo"
Documentation = "https://github.com/ocmo-oss/ocmo/tree/main/cli"

[tool.hatch.build.targets.wheel]
packages = ["ocmo_cli"]

[tool.hatch.build.targets.wheel.force-include]
"NOTICE" = "NOTICE"
"LICENSE" = "LICENSE"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "types-PyYAML>=6.0",
    "types-python-dateutil>=2.9",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
addopts = "--cov=ocmo_cli --cov-report=term-missing"
markers = [
    "integration: live OCMO API smoke tests (set OCMO_RUN_INTEGRATION=1)",
]
